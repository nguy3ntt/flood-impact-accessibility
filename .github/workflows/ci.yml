name: pipeline-checks
on: [push, pull_request]
jobs:
  core-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_network.py -v
      - run: python -m unittest discover -s tests -p test_acquire_pilot.py -v
      - run: python -m flood_access status
      - run: python -m flood_access demo --scenario conservative

  pipeline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements/m2-pipeline.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m flood_access status
      - run: python -m flood_access demo --scenario conservative
